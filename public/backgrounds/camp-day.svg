<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <title>Pfadilager am Tag</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6f2"/>
      <stop offset="0.55" stop-color="#e3eef9"/>
      <stop offset="1" stop-color="#fbf3e6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e3"/>
      <stop offset="0.45" stop-color="#fbe3b8"/>
      <stop offset="1" stop-color="#fbe3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c8ec"/>
      <stop offset="1" stop-color="#e3eef9"/>
    </linearGradient>
    <symbol id="pine" viewBox="0 0 40 100">
      <path d="M20 0 L36 38 H27 L38 66 H26 L40 92 H0 L14 66 H2 L13 38 H4 Z"/>
      <rect x="17" y="90" width="6" height="10"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 220 80">
      <path d="M30 70 Q0 70 8 50 Q12 32 40 36 Q48 8 82 14 Q104 0 128 18 Q160 6 176 34 Q214 32 212 56 Q212 72 186 72 Z"/>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1480" cy="250" r="220" fill="url(#sun)"/>
  <circle cx="1480" cy="250" r="78" fill="#fdeccf"/>

  <g fill="#ffffff" opacity="0.85">
    <use href="#cloud" x="180" y="150" width="300" height="110"/>
    <use href="#cloud" x="760" y="90" width="220" height="80" opacity="0.7"/>
    <use href="#cloud" x="1620" y="380" width="200" height="72" opacity="0.6"/>
  </g>

  <!-- far mountains -->
  <path d="M0 640 L180 470 L310 560 L470 380 L640 540 L790 430 L960 590 L1130 400 L1300 520 L1460 360 L1650 540 L1800 450 L1920 520 V1080 H0 Z" fill="#c9ddf3"/>
  <path d="M470 380 L520 428 L500 440 L470 420 L446 436 L430 420 Z M1130 400 L1176 446 L1154 452 L1130 436 L1106 452 L1092 440 Z M1460 360 L1510 410 L1486 418 L1460 398 L1436 418 L1418 404 Z" fill="#f2f7fc"/>
  <!-- mid mountains -->
  <path d="M0 720 L220 560 L380 650 L560 520 L760 680 L940 560 L1120 690 L1320 560 L1520 680 L1700 590 L1920 700 V1080 H0 Z" fill="#a9c8ec"/>

  <!-- hills -->
  <path d="M0 800 Q260 700 520 760 T1040 750 T1560 740 T1920 760 V1080 H0 Z" fill="#a2c29c"/>

  <!-- forest -->
  <g fill="#618a5a">
    <use href="#pine" x="40" y="680" width="56" height="140"/>
    <use href="#pine" x="96" y="700" width="44" height="110"/>
    <use href="#pine" x="150" y="670" width="60" height="150"/>
    <use href="#pine" x="230" y="705" width="42" height="104"/>
    <use href="#pine" x="1500" y="690" width="56" height="140"/>
    <use href="#pine" x="1560" y="660" width="66" height="166"/>
    <use href="#pine" x="1640" y="700" width="46" height="116"/>
    <use href="#pine" x="1700" y="672" width="60" height="150"/>
    <use href="#pine" x="1780" y="696" width="50" height="124"/>
    <use href="#pine" x="1840" y="676" width="58" height="146"/>
  </g>
  <g fill="#4c6f47">
    <use href="#pine" x="0" y="740" width="70" height="176"/>
    <use href="#pine" x="190" y="752" width="54" height="136"/>
    <use href="#pine" x="1620" y="750" width="70" height="176"/>
    <use href="#pine" x="1760" y="760" width="62" height="156"/>
  </g>

  <!-- lake -->
  <path d="M640 838 Q900 800 1180 830 Q1300 850 1200 880 Q900 916 640 884 Q560 860 640 838 Z" fill="url(#lake)" opacity="0.9"/>
  <path d="M760 850 H840 M930 862 H1040 M1100 846 H1160" stroke="#f2f7fc" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- meadow -->
  <path d="M0 900 Q480 850 960 900 T1920 880 V1080 H0 Z" fill="#c7dbc3"/>

  <!-- tents -->
  <g>
    <path d="M330 960 L440 800 L550 960 Z" fill="#edc491"/>
    <path d="M440 800 L410 960 L470 960 Z" fill="#b8722f"/>
    <path d="M440 800 L550 960 L582 954 L468 800 Z" fill="#e5aa6a"/>
    <path d="M1330 980 L1460 790 L1590 980 Z" fill="#f4dbb8"/>
    <path d="M1460 790 L1424 980 L1496 980 Z" fill="#d98f4a"/>
    <path d="M1460 790 L1590 980 L1626 972 L1490 790 Z" fill="#edc491"/>
    <path d="M1460 790 V760 L1500 772 L1460 784" fill="#86afe2"/>
  </g>

  <!-- campfire -->
  <g transform="translate(960 990)">
    <ellipse cx="0" cy="22" rx="110" ry="18" fill="#a2c29c"/>
    <path d="M-70 18 L70 -6" stroke="#955a28" stroke-width="16" stroke-linecap="round"/>
    <path d="M-70 -6 L70 18" stroke="#7b4929" stroke-width="16" stroke-linecap="round"/>
    <path d="M0 -110 C30 -70 52 -40 30 -6 C20 10 -20 10 -30 -6 C-50 -40 -20 -60 0 -110 Z" fill="#e5aa6a"/>
    <path d="M0 -62 C16 -40 24 -24 12 -6 C6 2 -8 2 -12 -6 C-22 -26 -8 -38 0 -62 Z" fill="#faeedc"/>
  </g>

  <!-- foreground grass -->
  <path d="M0 1020 Q240 990 480 1030 T960 1020 T1440 1030 T1920 1010 V1080 H0 Z" fill="#a2c29c"/>
</svg>
