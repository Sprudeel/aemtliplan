<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <title>Pfadilager in der Nacht</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="0.6" stop-color="#2c4364"/>
      <stop offset="1" stop-color="#3a5f96"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#faeedc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#faeedc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#edc491" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#d98f4a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d98f4a" stop-opacity="0"/>
    </radialGradient>
    <symbol id="pine" viewBox="0 0 40 100">
      <path d="M20 0 L36 38 H27 L38 66 H26 L40 92 H0 L14 66 H2 L13 38 H4 Z"/>
      <rect x="17" y="90" width="6" height="10"/>
    </symbol>
    <symbol id="star" viewBox="0 0 10 10">
      <path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8 Z"/>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <g fill="#e3eef9">
    <circle cx="120" cy="90" r="2"/><circle cx="260" cy="210" r="1.6"/><circle cx="420" cy="70" r="2.2"/>
    <circle cx="560" cy="180" r="1.4"/><circle cx="700" cy="60" r="1.8"/><circle cx="860" cy="240" r="1.5"/>
    <circle cx="980" cy="110" r="2.4"/><circle cx="1120" cy="200" r="1.6"/><circle cx="1260" cy="80" r="1.9"/>
    <circle cx="1700" cy="160" r="2"/><circle cx="1820" cy="70" r="1.5"/><circle cx="1560" cy="300" r="1.4"/>
    <circle cx="340" cy="330" r="1.4"/><circle cx="760" cy="350" r="1.2"/><circle cx="1040" cy="320" r="1.3"/>
    <circle cx="80" cy="380" r="1.5"/><circle cx="1880" cy="330" r="1.6"/><circle cx="640" cy="280" r="1.1"/>
  </g>
  <g fill="#faeedc">
    <use href="#star" x="300" y="130" width="16" height="16"/>
    <use href="#star" x="1180" y="130" width="12" height="12"/>
    <use href="#star" x="1760" y="240" width="14" height="14"/>
    <use href="#star" x="610" y="120" width="10" height="10"/>
  </g>

  <circle cx="1450" cy="230" r="200" fill="url(#moonGlow)"/>
  <circle cx="1450" cy="230" r="70" fill="#faeedc"/>
  <circle cx="1478" cy="214" r="70" fill="#1f2c43" opacity="0.9"/>

  <!-- far mountains -->
  <path d="M0 640 L180 470 L310 560 L470 380 L640 540 L790 430 L960 590 L1130 400 L1300 520 L1460 360 L1650 540 L1800 450 L1920 520 V1080 H0 Z" fill="#324f7a"/>
  <path d="M470 380 L520 428 L500 440 L470 420 L446 436 L430 420 Z M1130 400 L1176 446 L1154 452 L1130 436 L1106 452 L1092 440 Z M1460 360 L1510 410 L1486 418 L1460 398 L1436 418 L1418 404 Z" fill="#a9c8ec" opacity="0.7"/>
  <!-- mid mountains -->
  <path d="M0 720 L220 560 L380 650 L560 520 L760 680 L940 560 L1120 690 L1320 560 L1520 680 L1700 590 L1920 700 V1080 H0 Z" fill="#2c4364"/>

  <!-- hills -->
  <path d="M0 800 Q260 700 520 760 T1040 750 T1560 740 T1920 760 V1080 H0 Z" fill="#2c3c2a"/>

  <!-- forest -->
  <g fill="#1d2b1c">
    <use href="#pine" x="40" y="680" width="56" height="140"/>
    <use href="#pine" x="96" y="700" width="44" height="110"/>
    <use href="#pine" x="150" y="670" width="60" height="150"/>
    <use href="#pine" x="230" y="705" width="42" height="104"/>
    <use href="#pine" x="1500" y="690" width="56" height="140"/>
    <use href="#pine" x="1560" y="660" width="66" height="166"/>
    <use href="#pine" x="1640" y="700" width="46" height="116"/>
    <use href="#pine" x="1700" y="672" width="60" height="150"/>
    <use href="#pine" x="1780" y="696" width="50" height="124"/>
    <use href="#pine" x="1840" y="676" width="58" height="146"/>
  </g>
  <g fill="#162015">
    <use href="#pine" x="0" y="740" width="70" height="176"/>
    <use href="#pine" x="190" y="752" width="54" height="136"/>
    <use href="#pine" x="1620" y="750" width="70" height="176"/>
    <use href="#pine" x="1760" y="760" width="62" height="156"/>
  </g>

  <!-- lake with moon reflection -->
  <path d="M640 838 Q900 800 1180 830 Q1300 850 1200 880 Q900 916 640 884 Q560 860 640 838 Z" fill="#3a5f96" opacity="0.9"/>
  <path d="M1000 848 H1080 M1010 862 H1070 M1020 876 H1060" stroke="#faeedc" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- meadow -->
  <path d="M0 900 Q480 850 960 900 T1920 880 V1080 H0 Z" fill="#344832"/>

  <!-- fire glow -->
  <circle cx="960" cy="950" r="420" fill="url(#fireGlow)"/>

  <!-- tents, lit from the fire side -->
  <g>
    <path d="M330 960 L440 800 L550 960 Z" fill="#7b4929"/>
    <path d="M440 800 L410 960 L470 960 Z" fill="#edc491" opacity="0.85"/>
    <path d="M440 800 L550 960 L582 954 L468 800 Z" fill="#955a28"/>
    <path d="M1330 980 L1460 790 L1590 980 Z" fill="#643d25"/>
    <path d="M1460 790 L1424 980 L1496 980 Z" fill="#e5aa6a" opacity="0.8"/>
    <path d="M1460 790 L1590 980 L1626 972 L1490 790 Z" fill="#7b4929"/>
    <path d="M1460 790 V760 L1500 772 L1460 784" fill="#86afe2"/>
  </g>

  <!-- campfire -->
  <g transform="translate(960 990)">
    <ellipse cx="0" cy="22" rx="110" ry="18" fill="#2c3c2a"/>
    <path d="M-70 18 L70 -6" stroke="#643d25" stroke-width="16" stroke-linecap="round"/>
    <path d="M-70 -6 L70 18" stroke="#4a2c18" stroke-width="16" stroke-linecap="round"/>
    <path d="M0 -120 C34 -76 58 -42 32 -6 C20 10 -20 10 -32 -6 C-56 -42 -22 -64 0 -120 Z" fill="#e5aa6a"/>
    <path d="M0 -74 C20 -48 28 -26 14 -6 C6 2 -8 2 -14 -6 C-26 -28 -10 -44 0 -74 Z" fill="#faeedc"/>
    <g fill="#edc491"><circle cx="-26" cy="-150" r="3"/><circle cx="18" cy="-180" r="2.4"/><circle cx="34" cy="-140" r="2"/></g>
  </g>

  <!-- foreground grass -->
  <path d="M0 1020 Q240 990 480 1030 T960 1020 T1440 1030 T1920 1010 V1080 H0 Z" fill="#2c3c2a"/>
</svg>
