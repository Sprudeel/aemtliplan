name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aemtliplan
          POSTGRES_PASSWORD: aemtliplan
          POSTGRES_DB: aemtliplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aemtliplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://aemtliplan:aemtliplan@localhost:5432/aemtliplan_test"
      BETTER_AUTH_URL: "http://localhost:3999"
      BETTER_AUTH_SECRET: "ci-only-secret-not-used-anywhere-else-0123456789"
      AUTH_RATE_LIMIT: "off"
      ROTATION_SCHEDULER: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck

      - name: Run tests (migrates the test DB, builds and starts the server)
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
